[package]
name = "windows-use"
version = "0.1.0"
description = "MCP server that sees, reads and drives Windows desktop programs"
edition = "2024"
license = "MIT"
repository = "https://github.com/KaburiCoder/agent-plugins"
publish = false

[dependencies]
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
base64 = "0.23.1"
uiautomation = "0.25.1"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png", "rayon"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon"] }
arboard = "3.7.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
] }
